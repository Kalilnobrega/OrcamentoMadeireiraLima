<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cadastro de Madeiras - Madeireira Lima</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <header>
    <h1>Madeireira Lima</h1>
    <p class="subtitulo">Cadastro de peças</p>
    <a class="link-admin" href="/">← Voltar ao orçamento</a>
  </header>

  <main>
    <section class="cartao" id="cartao-login">
      <h2>Área restrita</h2>
      <p class="dica">Digite a senha de administrador para cadastrar ou editar preços.</p>
      <div class="campo">
        <label for="senha-admin">Senha</label>
        <input type="password" id="senha-admin" placeholder="Senha de administrador" />
      </div>
      <div class="acoes">
        <button type="button" id="btn-entrar" class="botao primario">Entrar</button>
      </div>
      <p id="erro-login" class="erro" hidden>Senha incorreta.</p>
    </section>

    <div id="area-protegida" hidden>
      <section class="cartao">
        <h2 id="titulo-form">Nova peça</h2>
        <input type="hidden" id="madeira-id" />
        <div class="linha-campos">
          <div class="campo">
            <label for="nome">Nome / espécie</label>
            <input type="text" id="nome" placeholder="Ex: Massaranduba" />
          </div>
          <div class="campo">
            <label for="largura">Largura (cm)</label>
            <input type="number" id="largura" min="0" step="0.1" placeholder="11" />
          </div>
          <div class="campo">
            <label for="espessura">Espessura (cm)</label>
            <input type="number" id="espessura" min="0" step="0.1" placeholder="5" />
          </div>
        </div>
        <div class="linha-campos">
          <div class="campo">
            <label for="preco-normal">Preço normal (R$/m)</label>
            <input type="number" id="preco-normal" min="0" step="0.01" placeholder="40,00" />
          </div>
          <div class="campo">
            <label for="preco-aparelhado">Preço aparelhado (R$/m)</label>
            <input type="number" id="preco-aparelhado" min="0" step="0.01" placeholder="50,00" />
          </div>
        </div>
        <div class="acoes">
          <button type="button" id="btn-salvar" class="botao primario">Salvar</button>
          <button type="button" id="btn-cancelar" class="botao secundario" hidden>Cancelar edição</button>
        </div>
      </section>

      <section class="cartao">
        <h2>Peças cadastradas</h2>
        <div class="tabela-scroll">
          <table>
            <thead>
              <tr>
                <th>Nome</th>
                <th>Bitola</th>
                <th>Preço normal</th>
                <th>Preço aparelhado</th>
                <th>Ativa</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="corpo-tabela-madeiras"></tbody>
          </table>
        </div>
      </section>
    </div>
  </main>

  <script src="/static/admin.js"></script>
</body>
</html>
